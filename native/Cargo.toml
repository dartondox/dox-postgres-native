[package]
name = "dox_postgres_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
deadpool-postgres = "0.14.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
webpki-roots = "1.0.11"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
