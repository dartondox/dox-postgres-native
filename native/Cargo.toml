[package]
name = "dox_postgres_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
postgres-protocol = "0.6.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
webpki-roots = "1.0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
